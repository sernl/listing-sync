[package]
name    = "tam-marketplace-tes"
version = "0.0.0"
edition = "2021"
publish = false

# `live` is the reqwest-backed transport and nothing else: the endpoints,
# flows, classifiers and schema are generic over the seam. Without it the
# crate carries no HTTP client and compiles for the client targets
# `just check-portable` proves; every workspace consumer takes default
# features and is unaffected.
[features]
default = ["live"]
live    = ["dep:reqwest"]

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", optional = true, default-features = false, features = [
  "rustls-tls",
  "json",
  "multipart",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
tam-marketplace = { path = "../tam-marketplace" }
tam-types = { path = "../tam-types" }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name              = "live_smoke"
required-features = ["live"]

[lints]
workspace = true
