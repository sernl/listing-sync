[package]
name    = "tam-marketplace-tes"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "multipart",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tam-marketplace = { path = "../tam-marketplace" }
tam-types = { path = "../tam-types" }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
