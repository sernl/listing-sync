[package]
name    = "tam-engine"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tam-domain = { path = "../tam-domain" }
tam-engine-driver = { path = "../tam-engine-driver" }
tam-limits = { path = "../tam-limits" }
serde = { version = "1", features = ["derive"] }
tam-marketplace = { path = "../tam-marketplace" }
tam-pipeline = { path = "../tam-pipeline" }
tam-taxonomy = { path = "../tam-taxonomy" }
tam-storage = { path = "../tam-storage" }
tam-types = { path = "../tam-types" }
tokio = { version = "1", features = ["net", "io-util"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[features]
pg-tests = []

[dev-dependencies]
base64 = "0.22"
futures = { version = "0.3", default-features = false, features = ["executor"] }
tam-marketplace-tes = { path = "../tam-marketplace-tes" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
