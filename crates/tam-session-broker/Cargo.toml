[package]
name    = "tam-session-broker"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid"] }
tam-limits = { path = "../tam-limits" }
tam-secrets = { path = "../tam-secrets" }
tam-types = { path = "../tam-types" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "io-util"] }
tokio-util = "0.7"
uuid = "1"

[features]
pg-tests = []

[dev-dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate", "macros"] }
tam-secrets = { path = "../tam-secrets" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = "1" 

[lints]
workspace = true
