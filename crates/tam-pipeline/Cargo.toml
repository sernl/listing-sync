[package]
name    = "tam-pipeline"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# `pure` by founder decision, 2026-09-03: it drops blake3's C and asm
# paths, so every client target compiles without a C toolchain. Measured
# cost 2.47 to 1.71 GiB/s single-core, accepted.
blake3 = { version = "1", features = ["pure"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
tam-limits = { path = "../tam-limits" }
tam-types = { path = "../tam-types" }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
