[package]
name    = "tam-core-wasm"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
tam-authoring = { path = "../tam-authoring" }
tam-domain    = { path = "../tam-domain" }
tam-types     = { path = "../tam-types" }
# Pinned exactly, not by range: wasm-bindgen refuses a CLI whose version
# differs from the crate's, and the CLI is the one nixpkgs carries at the rev
# flake.lock pins.
wasm-bindgen  = "=0.2.121"

[lints]
workspace = true
