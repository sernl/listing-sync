[package]
name    = "tam-server"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
# The console's policy carries a hash per inline script, so the shell it serves
# actually boots; both are the versions the rest of the workspace pins.
base64 = "0.22"
sha2 = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tam-api = { path = "../tam-api" }
tam-engine = { path = "../tam-engine" }
tam-limits = { path = "../tam-limits" }
tam-secrets = { path = "../tam-secrets" }
tam-storage = { path = "../tam-storage" }
tam-types = { path = "../tam-types" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["fs"] }

[lints]
workspace = true
