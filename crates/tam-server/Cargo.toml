[package]
name    = "tam-server"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
# The console's policy carries a hash per inline script, so the shell it serves
# actually boots; both are the versions the rest of the workspace pins.
base64 = "0.22"
sha2 = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tam-api = { path = "../tam-api" }
tam-engine = { path = "../tam-engine" }
tam-limits = { path = "../tam-limits" }
tam-secrets = { path = "../tam-secrets" }
tam-storage = { path = "../tam-storage" }
tam-types = { path = "../tam-types" }
# `fs` and tokio-util's `io` are the downloads tier: its directory changes
# under a running process, so each request opens the file again and streams it
# rather than holding an installer in this process's heap.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs"] }

# The assembled router driven without a listener, which is the only way to see
# the tier ordering and the per-tier headers at once. Both versions are the ones
# tam-api's own dev-dependencies pin, for the same use.
[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
