[package]
name    = "tam-server"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
# The console's policy carries a hash per inline script, so the shell it serves
# actually boots; both are the versions the rest of the workspace pins.
base64 = "0.22"
sha2 = { workspace = true }
# The per-response script nonce: sixteen random bytes, the same v4 source
# tam-api already links for its identifiers.
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# The outbox payload is a `serde_json::Value` and the relay's request body is
# one too, so this crate names what it already links: `serde_json` is a
# direct dependency of sibling crates here and reaches this binary through
# `tam-storage`'s own public API. Naming it adds an edge and no package.
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tam-api = { path = "../tam-api" }
# The object-store flags and the backend they name. The spellings live there
# rather than here so this binary and `tam-pipeline-worker` cannot drift apart
# on them.
tam-blob-store = { path = "../tam-blob-store" }
tam-engine = { path = "../tam-engine" }
tam-limits = { path = "../tam-limits" }
tam-secrets = { path = "../tam-secrets" }
tam-storage = { path = "../tam-storage" }
tam-types = { path = "../tam-types" }
# `fs` and tokio-util's `io` are the downloads tier: its directory changes
# under a running process, so each request opens the file again and streams it
# rather than holding an installer in this process's heap.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs"] }
# The `Service` trait itself, so `api_namespace` can hand a request the API
# does not own to the tier mounted behind it. That tier is a `Router`, which
# is already a service; naming the trait's own crate is what makes it callable
# here. It is axum's own dependency and already in the lock, so this edge adds
# a name and no package.
tower-service = "0.3"

# The assembled router driven without a listener, which is the only way to see
# the tier ordering and the per-tier headers at once. Both versions are the ones
# tam-api's own dev-dependencies pin, for the same use.
[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
