[package]
name    = "tam-server"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tam-api = { path = "../tam-api" }
tam-types = { path = "../tam-types" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }

[lints]
workspace = true
