[package]
name    = "tam-engine-driver"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tam-domain = { path = "../tam-domain" }
tam-limits = { path = "../tam-limits" }
# blake3 directly rather than through tam-pipeline: the intent hash is one
# call, and the pipeline edge dragged an image decoder and a zip implementation
# into every client binary to reach it. Same `pure` feature tam-pipeline and
# tam-desktop already carry, so it resolves to one build.
blake3 = { version = "1", features = ["pure"] }
tam-marketplace = { path = "../tam-marketplace" }
# The sketch a device asserts, carried on the import page. `default-features
# = false` deliberately: the readers that produce one (a PDF text extractor,
# a PDF object parser, a perceptual hasher) are behind that crate's `compute`
# feature, and this crate is checked for wasm32 in `just check-portable`.
# What crosses here is the vocabulary, which is serde and arithmetic.
tam-fingerprint = { path = "../tam-fingerprint", default-features = false }
tam-types = { path = "../tam-types" }

[features]
# The conformance bodies and the in-memory ledger, so `tam-engine` can run the
# same assertions against Postgres. Off by default: a client build ships
# neither.
testing = []

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
# The suite's in-memory instantiation needs the fixtures the feature gates.
tam-engine-driver = { path = ".", features = ["testing"] }

[lints]
workspace = true
