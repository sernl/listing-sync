[package]
name    = "tam-storage"
version = "0.0.0"
edition = "2021"
publish = false

[features]
pg-tests = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "chrono",
  "migrate",
  "macros",
  "json",
] }
tam-domain = { path = "../tam-domain" }
tam-marketplace = { path = "../tam-marketplace" }
tam-pipeline = { path = "../tam-pipeline" }
tam-secrets = { path = "../tam-secrets" }
tam-types = { path = "../tam-types" }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"
tam-taxonomy = { path = "../tam-taxonomy" }
# Tests only, and only to run two transactions at once: a deadlock needs two,
# and the lock order this crate documents cannot be proved with one. Same
# version and features `tam-api` already uses for its own tests, so this is an
# edge in the graph rather than a crate in it — sqlx already brings the runtime
# these tests execute on.
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
