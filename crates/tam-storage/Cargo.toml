[package]
name    = "tam-storage"
version = "0.0.0"
edition = "2021"
publish = false

[features]
pg-tests = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The zone database, compiled in. A schedule stores the seller's wall time and
# the zone they read it in, so turning "nine on Friday in Europe/London" into
# an instant needs the rules -- and nothing already in this tree has them:
# `iana-time-zone` answers which zone this machine is in and not what any zone
# does, and `jiff` reaches its database through `/usr/share/zoneinfo` and the
# `TZDIR` environment variable, which is an ambient read the lint table bans
# outside the one crate that will own them and a file a minimal container does
# not have. This crate's copy is a table linked into the binary: the same
# answer on every host, and a wrong answer is a build to redeploy rather than
# a filesystem to inspect. `default-features = false` drops the crate's
# regex-filtered build script and its `serde` impls, neither of which a parse
# needs.
chrono-tz = { version = "0.10", default-features = false }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "chrono",
  "migrate",
  "macros",
  "json",
] }
tam-domain = { path = "../tam-domain" }
# For the wire shapes the device surface and the storage rows share. This
# direction only: `just purity` bans `tam-storage` from the driver's own tree,
# so the conversions live here rather than there.
tam-engine-driver = { path = "../tam-engine-driver" }
tam-marketplace = { path = "../tam-marketplace" }
# The plan vocabulary the entitlement grants are stored in. One enum decides
# what a row may hold, what the CHECK in migration 0069 enumerates and what
# every gate reads, so the storage layer parses into it rather than handing
# strings upwards.
tam-limits = { path = "../tam-limits" }
tam-pipeline = { path = "../tam-pipeline" }
tam-secrets = { path = "../tam-secrets" }
tam-types = { path = "../tam-types" }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"
tam-taxonomy = { path = "../tam-taxonomy" }
# Tests only, and only to run two transactions at once: a deadlock needs two,
# and the lock order this crate documents cannot be proved with one. Same
# version and features `tam-api` already uses for its own tests, so this is an
# edge in the graph rather than a crate in it — sqlx already brings the runtime
# these tests execute on.
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
