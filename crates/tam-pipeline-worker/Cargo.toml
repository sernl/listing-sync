[package]
name    = "tam-pipeline-worker"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
# The object store this deployment writes into, and the flags that name it:
# the same set `tam-server` reads, from the same crate.
tam-blob-store = { path = "../tam-blob-store" }
tam-limits = { path = "../tam-limits" }
tam-pipeline = { path = "../tam-pipeline" }
tam-secrets = { path = "../tam-secrets" }
tam-storage = { path = "../tam-storage" }
tam-types = { path = "../tam-types" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
