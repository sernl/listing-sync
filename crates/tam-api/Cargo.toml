[package]
name    = "tam-api"
version = "0.0.0"
edition = "2021"
publish = false

[features]
pg-tests = []

[dependencies]
axum = "0.8"
# The spreadsheet import's reader and writer. Here rather than in
# `tam-import`, which is the marketplace catalogue import and is feature-gated
# so that this crate can take its library half without acquiring a marketplace
# adapter; a spreadsheet parser behind that gate would push both crates through
# it for no reason. Both are read and written only by `import_batch`.
calamine = { workspace = true }
futures-util = { version = "0.3", default-features = false }
hmac = { workspace = true }
jsonwebtoken = { version = "9.3", default-features = false }
# The guide renderer, and the same workspace edge `tam-marketplace-tpt`
# already holds: `default-features = false` with `html` alone, so the parser
# and the HTML writer arrive and nothing else does. No package joins the lock
# for it. What this crate does with it differs from that one — `guides::render`
# escapes raw HTML rather than passing it through — and the difference is
# stated there rather than assumed from the shared dependency.
pulldown-cmark = { workspace = true }
# The checked PKCS#8 parse, which is what derives the public half an operator
# compares against the fleet's repository variable. `jsonwebtoken` signs through
# `from_pkcs8_maybe_unchecked` and so cannot answer that question. Promoted from
# a dev-dependency rather than newly introduced: `cargo tree -e normal -p tam-api
# -i ring` already reaches it through `jsonwebtoken` and through `rustls` under
# `sqlx`, so this edge adds no package to the graph and no code to the binary.
ring = { version = "0.17", features = ["std"] }
rust_xlsxwriter = { workspace = true }
# Renamed, and the rename is the point rather than a preference: this crate
# already carries `zip 2` as a dev-dependency for the archive-upload tests, and
# with both in scope the lib test target has two candidates for the name and
# refuses to link. The alias goes away when that dev-dependency does. The
# version is `calamine`'s own, so the archive bounded in `import_batch::parse`
# is parsed by the same reader that will decompress it.
zip8 = { package = "zip", version = "8.6", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { workspace = true }
subtle = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tam-authoring  = { path = "../tam-authoring" }
tam-domain = { path = "../tam-domain" }
# The declarative-intent surface answers a projected listing, and
# `prepare_item` is the server-side producer of one.
tam-engine = { path = "../tam-engine" }
# `import_one` and `MeasureTotals` for the device-import route, and the library
# half only: `default-features = false` drops the operator binary's feature,
# which is what keeps a marketplace adapter out of this crate's normal graph.
# D1's direction, verified by `cargo tree -e normal -p tam-api -i
# tam-marketplace-tpt` printing nothing.
tam-import = { path = "../tam-import", default-features = false }
# The envelope and the settle carry the interpreter's own vocabulary rather
# than restating it, so the wire has exactly one definition.
tam-engine-driver = { path = "../tam-engine-driver" }
# The sketch format and its pure comparisons. The device computes the
# fingerprints and the server blocks, scores and persists them, so both halves
# have to agree on one definition of a shingle, a band and a Jaccard; two
# copies of that is how a matcher silently stops matching.
tam-fingerprint = { path = "../tam-fingerprint" }
tam-limits = { path = "../tam-limits" }
tam-marketplace = { path = "../tam-marketplace" }
tam-pipeline = { path = "../tam-pipeline" }
tam-secrets = { path = "../tam-secrets" }
tam-standards = { path = "../tam-standards" }
tam-storage = { path = "../tam-storage" }
# The drain: a catalogue migration is canonicalised in full at confirm and no
# device page follows to drain it, so the confirm handler mints its legs.
tam-sync-worker = { path = "../tam-sync-worker" }
tam-taxonomy = { path = "../tam-taxonomy" }
tam-types = { path = "../tam-types" }
# `rt` is named rather than inherited: `import_batch` puts the spreadsheet
# parse on `spawn_blocking`, which lives behind that feature. It resolves today
# through axum's own edge, and a dependency whose compilation relies on another
# crate's feature selection is one that breaks when that crate changes its mind.
tokio = { version = "1", features = ["time", "net", "io-util", "sync", "rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
base64 = "0.22"
http-body-util = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid"] }
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
# Already in the lock through tam-pipeline; a dev-dependency edge so the
# keep-whole archive mode is exercised over the wire and not only in the
# pipeline's own unit test.
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
