[package]
name    = "tam-api"
version = "0.0.0"
edition = "2021"
publish = false

[features]
pg-tests = []

[dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
hmac = { workspace = true }
jsonwebtoken = { version = "9.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { workspace = true }
subtle = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tam-authoring  = { path = "../tam-authoring" }
tam-domain = { path = "../tam-domain" }
# The declarative-intent surface answers a projected listing, and
# `prepare_item` is the server-side producer of one.
tam-engine = { path = "../tam-engine" }
# The envelope and the settle carry the interpreter's own vocabulary rather
# than restating it, so the wire has exactly one definition.
tam-engine-driver = { path = "../tam-engine-driver" }
tam-limits = { path = "../tam-limits" }
tam-marketplace = { path = "../tam-marketplace" }
tam-pipeline = { path = "../tam-pipeline" }
tam-secrets = { path = "../tam-secrets" }
tam-storage = { path = "../tam-storage" }
tam-taxonomy = { path = "../tam-taxonomy" }
tam-types = { path = "../tam-types" }
tokio = { version = "1", features = ["time", "net", "io-util", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
base64 = "0.22"
http-body-util = "0.1"
ring = { version = "0.17", features = ["std"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid"] }
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
# Already in the lock through tam-pipeline; a dev-dependency edge so the
# keep-whole archive mode is exercised over the wire and not only in the
# pipeline's own unit test.
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
