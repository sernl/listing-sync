[package]
name    = "tam-api"
version = "0.0.0"
edition = "2021"
publish = false

[features]
pg-tests = []

[dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tam-domain = { path = "../tam-domain" }
tam-marketplace = { path = "../tam-marketplace" }
tam-storage = { path = "../tam-storage" }
tam-taxonomy = { path = "../tam-taxonomy" }
tam-types = { path = "../tam-types" }
tokio = { version = "1", features = ["time", "net", "io-util"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid"] }
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
