# What every desktop bundle job does before it builds: fetch the console the
# `console` job built, install the pinned Rust toolchain with any extra
# targets, and install the pinned Tauri CLI. One place, so the Windows, macOS
# and Linux jobs cannot drift onto different CLIs.
name: tauri-setup
description: Console artefact, Rust toolchain and the pinned Tauri CLI for a desktop bundle job.
inputs:
  tauri-cli-version:
    description: The @tauri-apps/cli version, which is the one the dev shell carries.
    required: true
  targets:
    description: Extra rustc targets, comma separated, beyond rust-toolchain.toml.
    required: false
    default: ""
  rustflags:
    description: >-
      RUSTFLAGS for the build. The toolchain action defaults to -D warnings and
      reads an empty value as unset, so a job that needs warnings capped says so.
    required: false
    default: "-D warnings"
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: console
        path: web/build
    # No `toolchain:` input: the action reads rust-toolchain.toml, which is
    # where the channel lives.
    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        target: ${{ inputs.targets }}
        cache: true
        rustflags: ${{ inputs.rustflags }}
    - name: install the Tauri CLI
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.tauri-cli-version }}
      run: |
        set -euo pipefail
        npm install -g "@tauri-apps/cli@$CLI_VERSION"
        tauri --version
