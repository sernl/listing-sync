# Tagged releases for every platform, built, signed and published on one tag:
# Windows (NSIS + MSI, and the Microsoft Store), macOS (a universal Developer
# ID app and disk image, and the Mac App Store), Linux (AppImage + .deb) and
# Android (a sideload APK, and an AAB for Google Play). Distributed through
# GitHub, CrabNebula Cloud and the download mirror.
#
# The jobs, and the secrets that gate each, are in
# docs/notes/runbooks/release.md; the design is
# docs/notes/design/desktop-distribution.md. A platform whose secrets are
# absent is skipped and the run summary says which secret was missing.
name: desktop-release

# A tag on this repository is the only trigger. There is no workflow_dispatch,
# no branch trigger and no schedule, so there is no path to a release build
# that is not a tag, and every job additionally refuses to run on a fork.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# No permission by default; each job asks for what it needs and no more.
permissions: {}

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The same CLI the dev shell carries (nixpkgs cargo-tauri 2.11.4), so a
  # release bundles with the version local builds were exercised against.
  # Reusable workflows do not inherit `env`, so each receives it as an input.
  TAURI_CLI_VERSION: "2.11.4"

jobs:
  # Refuse the release before anything is built — seconds here rather than a
  # Windows runner's minutes, and the same script `just release-check` runs —
  # and decide which platforms this tag can sign.
  verify:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      tauri-cli-version: ${{ steps.check.outputs.tauri-cli-version }}
      windows_signing: ${{ steps.plan.outputs.windows_signing }}
      macos: ${{ steps.plan.outputs.macos }}
      macos_notary: ${{ steps.plan.outputs.macos_notary }}
      mac_app_store: ${{ steps.plan.outputs.mac_app_store }}
      android: ${{ steps.plan.outputs.android }}
      play: ${{ steps.plan.outputs.play }}
      store_installer: ${{ steps.plan.outputs.store_installer }}
      msstore: ${{ steps.plan.outputs.msstore }}
    env:
      # `secrets` is not a context an `if:` may read, but a job-level `env:`
      # may, so each question is answered once here as a boolean and reaches
      # the jobs that need it as an output.
      HAS_AZURE_SIGNING: >-
        ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != ''
        && secrets.AZURE_TENANT_ID != '' }}
      HAS_PFX_SIGNING: >-
        ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
      HAS_APPLE_CERT: >-
        ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
      HAS_APPLE_ID: >-
        ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_APPLE_API_KEY: >-
        ${{ secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY != ''
        && secrets.APPLE_API_KEY_P8 != '' }}
      HAS_APP_STORE: >-
        ${{ secrets.APPLE_APP_STORE_CERTIFICATE != ''
        && secrets.APPLE_APP_STORE_CERTIFICATE_PASSWORD != ''
        && secrets.APPLE_APP_STORE_PROVISIONING_PROFILE != ''
        && secrets.APPLE_TEAM_ID != '' }}
      HAS_ANDROID: >-
        ${{ secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != ''
        && secrets.ANDROID_KEY_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
      HAS_MSSTORE: >-
        ${{ secrets.MSSTORE_TENANT_ID != '' && secrets.MSSTORE_CLIENT_ID != ''
        && secrets.MSSTORE_CLIENT_SECRET != '' && secrets.MSSTORE_SELLER_ID != ''
        && secrets.MSSTORE_PRODUCT_ID != '' }}
      PLAY_TRACK: ${{ vars.PLAY_TRACK }}
      MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check the tag against the tree
        id: check
        env:
          TAG: ${{ github.ref_name }}
          CLI_VERSION: ${{ env.TAURI_CLI_VERSION }}
        run: |
          set -euo pipefail
          bash .github/scripts/release-check.sh "$TAG"
          printf 'version=%s\n' "${TAG#v}" >> "$GITHUB_OUTPUT"
          printf 'tauri-cli-version=%s\n' "$CLI_VERSION" >> "$GITHUB_OUTPUT"
      # A release built without this carries no entitlement key at all, so it
      # verifies no token and every seller's gate answers no. It is a repository
      # variable rather than a secret because a public key is not one, and
      # because a variable is greppable in this log when diagnosing a fleet that
      # verifies nothing.
      #
      # One key, or two separated by a comma while a rotation is in flight: a
      # release carrying the outgoing and the incoming key verifies tokens signed
      # by either, which is what lets the fleet cross without a window in which
      # somebody's gate is shut.
      - name: require the entitlement public key
        env:
          TAM_ENTITLEMENT_PUBLIC_KEY: ${{ vars.TAM_ENTITLEMENT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$TAM_ENTITLEMENT_PUBLIC_KEY" ]; then
            echo "the TAM_ENTITLEMENT_PUBLIC_KEY repository variable is unset." >&2
            echo "A release built without it carries no entitlement key, verifies no" >&2
            echo "token, and every seller's gate answers no." >&2
            echo "Mint the pair with \`just entitlement-key\` and set the variable;" >&2
            echo "see docs/notes/design/desktop-client.md." >&2
            exit 1
          fi
          if ! printf '%s' "$TAM_ENTITLEMENT_PUBLIC_KEY" \
              | grep -Eq '^[0-9a-f]{64}(,[0-9a-f]{64})?$'; then
            echo "TAM_ENTITLEMENT_PUBLIC_KEY must be 64 lowercase hex characters, or two" >&2
            echo "such values separated by a comma and nothing else." >&2
            echo "The desktop build script refuses anything else, so this would fail" >&2
            echo "on the Windows runner instead of here." >&2
            exit 1
          fi
          if [ "$TAM_ENTITLEMENT_PUBLIC_KEY" = "${TAM_ENTITLEMENT_PUBLIC_KEY%%,*},${TAM_ENTITLEMENT_PUBLIC_KEY%%,*}" ]; then
            echo "TAM_ENTITLEMENT_PUBLIC_KEY names the same key twice; two keys exist for" >&2
            echo "a rotation, so a duplicate means one was meant to be the other." >&2
            exit 1
          fi
          echo "entitlement public key present and well formed"

      - name: decide which platforms this tag can sign
        id: plan
        run: bash .github/scripts/release-plan.sh >> "$GITHUB_OUTPUT"

  # The draft every build job uploads into. Version comes from the Tauri config
  # through --framework, so the Cloud and the tree cannot disagree. `draft` is
  # the only verb that takes notes: `upload` and `publish` have no such flag,
  # so a release that drafts without them carries `"notes":""` for ever, which
  # is what 0.1.1 did.
  draft:
    needs: verify
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: require the application slug
        env:
          CN_APPLICATION: ${{ vars.CN_APPLICATION }}
        run: |
          set -euo pipefail
          if [ -z "$CN_APPLICATION" ]; then
            echo "the CN_APPLICATION repository variable is unset; it is the org/app pair" >&2
            exit 1
          fi
      - name: create the release draft
        uses: crabnebula-dev/cloud-release@1a8803698ba41de6b23e42abc5dcc3721308233c # action-v0.2.6
        with:
          command: >-
            release draft ${{ vars.CN_APPLICATION }} --framework tauri
            --notes-file ../../docs/releases/${{ needs.verify.outputs.version }}.md
            ${{ vars.CN_CHANNEL && format('--channel {0}', vars.CN_CHANNEL) || '' }}
          api-key: ${{ secrets.CN_API_KEY }}
          working-directory: apps/desktop

  # The console is built here rather than on the Windows runner because it
  # needs wasm-bindgen, whose CLI version must equal the crate's pin exactly.
  # Deriving the version from the pin keeps one source of truth; rebuilding
  # this on Windows would need a second pin in a second package manager.
  console:
    needs: verify
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          # No `toolchain:` input: the action reads rust-toolchain.toml, which
          # is where the channel and the wasm32 target already live.
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install the wasm-bindgen CLI the crate pins
        run: |
          set -euo pipefail
          version=$(sed -n 's/^wasm-bindgen[[:space:]]*=[[:space:]]*"=\([0-9.]*\)".*/\1/p' \
            crates/tam-core-wasm/Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "no exact wasm-bindgen pin found in crates/tam-core-wasm/Cargo.toml" >&2
            exit 1
          fi
          echo "wasm-bindgen pin: $version"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: build the browser core and the console
        run: |
          set -euo pipefail
          cargo build --target wasm32-unknown-unknown --release --lib -p tam-core-wasm
          wasm-bindgen --target web --out-name core \
            --out-dir web/src/lib/core/generated \
            target/wasm32-unknown-unknown/release/tam_core_wasm.wasm
          cd web
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console
          path: web/build
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: [verify, draft, console]
    if: ${{ !github.event.repository.fork }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-windows.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      tauri-cli-version: ${{ needs.verify.outputs.tauri-cli-version }}
      signing: ${{ needs.verify.outputs.windows_signing }}
      store: ${{ needs.verify.outputs.store_installer == 'true' }}
    secrets: inherit

  macos:
    needs: [verify, draft, console]
    if: ${{ !github.event.repository.fork && needs.verify.outputs.macos == 'true' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-macos.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      tauri-cli-version: ${{ needs.verify.outputs.tauri-cli-version }}
      notary: ${{ needs.verify.outputs.macos_notary }}
    secrets: inherit

  # Independent of every other job's outcome and of the Cloud: the store
  # build goes to App Store Connect and nowhere else.
  mac-app-store:
    needs: [verify, console]
    if: ${{ !github.event.repository.fork && needs.verify.outputs.mac_app_store == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-mac-app-store.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      tauri-cli-version: ${{ needs.verify.outputs.tauri-cli-version }}
    secrets: inherit

  linux:
    needs: [verify, draft, console]
    if: ${{ !github.event.repository.fork }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-linux.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      tauri-cli-version: ${{ needs.verify.outputs.tauri-cli-version }}
    secrets: inherit

  android:
    needs: [verify, draft, console]
    if: ${{ !github.event.repository.fork && needs.verify.outputs.android == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-android.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      tauri-cli-version: ${{ needs.verify.outputs.tauri-cli-version }}
      play: ${{ needs.verify.outputs.play == 'true' }}
    secrets: inherit

  # The same release on GitHub: every platform's artefacts, their updater
  # signatures, one SHA256SUMS.txt over all of them, the static updater
  # manifest, and the notes the Cloud was given. The download mirror reads
  # this release, so this is also what reaches teachouse.io/downloads/.
  #
  # Windows is the one platform a release requires: it is what the installed
  # base updates from. Every other platform is additive — it is attached when
  # its job succeeded and the summary says why when it did not. A skipped or
  # failed `needs` would otherwise skip this job, which is why the condition
  # uses a status function and then names the one result it requires.
  github-release:
    needs: [verify, windows, macos, mac-app-store, linux, android]
    if: >-
      ${{ !cancelled() && !github.event.repository.fork
      && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x86_64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.macos.result == 'success' }}
        with:
          name: macos-universal
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.linux.result == 'success' }}
        with:
          name: linux-x86_64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.android.result == 'success' }}
        with:
          name: android-universal
          path: release

      # What each platform job came to, beside the plan the verify job wrote:
      # skipped means its secrets were absent, anything else is worth a look.
      - name: say what this release carries
        env:
          WINDOWS: ${{ needs.windows.result }}
          WINDOWS_SIGNING: ${{ needs.verify.outputs.windows_signing }}
          MACOS: ${{ needs.macos.result }}
          MAC_APP_STORE: ${{ needs.mac-app-store.result }}
          LINUX: ${{ needs.linux.result }}
          ANDROID: ${{ needs.android.result }}
          PLAY: ${{ needs.verify.outputs.play }}
        run: |
          set -euo pipefail
          line() {
            local name=$1 result=$2 carried=$3
            case "$result" in
              success) echo "| $name | $carried |" ;;
              skipped) echo "| $name | skipped: its secrets are not set (see the release plan above) |" ;;
              *) echo "| $name | **$result** |"; echo "::warning::$name finished as $result" >&2 ;;
            esac
          }
          {
            echo "### What this release carries"
            echo
            echo "| Platform | Result |"
            echo "| --- | --- |"
            line "Windows" "$WINDOWS" "NSIS + MSI ($WINDOWS_SIGNING signing) on GitHub and the Cloud"
            line "macOS" "$MACOS" "universal dmg + updater archive on GitHub and the Cloud"
            line "Mac App Store" "$MAC_APP_STORE" "uploaded to App Store Connect"
            line "Linux" "$LINUX" "AppImage + deb on GitHub and the Cloud"
            if [ "$PLAY" = true ]; then
              line "Android" "$ANDROID" "APK on GitHub and the Cloud; AAB uploaded to Google Play"
            else
              line "Android" "$ANDROID" "APK on GitHub and the Cloud; no Google Play upload"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The AAB installs from Play alone, so it is not a release asset.
      - name: write the checksums and the updater manifest
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          UPDATER_BASE_URL: ${{ vars.UPDATER_BASE_URL }}
        run: |
          set -euo pipefail
          rm -f release/*.aab
          ( cd release && find . -maxdepth 1 -type f ! -name '*.sig' -printf '%f\0' \
              | sort -z | xargs -0 sha256sum -- ) > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt
          bash .github/scripts/updater-manifest.sh "$VERSION" release "$UPDATER_BASE_URL" \
            > release/latest.json
          cat release/latest.json

      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          CN_CHANNEL: ${{ vars.CN_CHANNEL }}
        run: |
          set -euo pipefail
          notes="docs/releases/$VERSION.md"
          if [ ! -s "$notes" ]; then
            echo "no release notes at $notes" >&2
            exit 1
          fi
          # A channelled release is a pre-release: a beta must not present
          # itself as the repository's latest release.
          flags=()
          if [ -n "${CN_CHANNEL:-}" ]; then
            flags+=(--prerelease)
          fi
          ls -l release
          gh release create "$TAG" --title "$TAG" --notes-file "$notes" \
            "${flags[@]}" release/*

  # The Microsoft Store installs EXE apps from a URL the publisher hosts, and
  # fetches it again on every Store install, so the package URL must be a
  # public, versioned, immutable file. The GitHub release is private; the
  # download mirror is public, keeps the current Store installer and the one
  # before it, and refreshes from the release above within one interval. This
  # waits for the mirror to serve the exact bytes the Windows job built, then
  # replaces the draft submission's package and submits it.
  #
  # The Store CLI rather than raw REST: Microsoft's own store-submission action
  # is archived in its favour, and it covers EXE apps
  # (https://github.com/microsoft/store-submission#migrating-to-the-msstore-cli).
  # Tauri cannot build MSIX (tauri-apps/tauri#4818), so an EXE is the Store
  # package Tauri documents (https://v2.tauri.app/distribute/microsoft-store/).
  microsoft-store:
    needs: [verify, github-release]
    if: >-
      ${{ !cancelled() && !github.event.repository.fork
      && needs.verify.outputs.msstore == 'true' && needs.github-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PACKAGE_BASE_URL: ${{ vars.MSSTORE_PACKAGE_BASE_URL || 'https://teachouse.io/downloads' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x86_64
          path: windows
      - name: wait for the download mirror to serve the Store installer
        id: url
        run: |
          set -euo pipefail
          name="Teachouse_${VERSION}_x64_store-setup.exe"
          expected=$(sha256sum "windows/$name" | cut -d' ' -f1)
          url="${PACKAGE_BASE_URL%/}/$name"
          # Two refresh intervals of fifteen minutes and a margin.
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --location --max-time 600 --output "$RUNNER_TEMP/store.exe" "$url"; then
              actual=$(sha256sum "$RUNNER_TEMP/store.exe" | cut -d' ' -f1)
              if [ "$actual" = "$expected" ]; then
                echo "$url serves the installer the Windows job built"
                printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "$url answers with different bytes ($actual, expected $expected)" >&2
              exit 1
            fi
            echo "attempt $attempt: $url is not served yet"
            sleep 60
          done
          echo "the download mirror did not serve $url within forty minutes; is the refresh running?" >&2
          exit 1
      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.3
      # The package entry Partner Center needs for an EXE: silent install by
      # NSIS's own `/S` (Tauri's Microsoft Store guide), x64 only, and a page
      # documenting the installer's exit codes, which for NSIS is its manual.
      - name: replace the draft submission's package and submit it
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID }}
          PACKAGE_URL: ${{ steps.url.outputs.url }}
          GENERIC_DOC_URL: ${{ vars.MSSTORE_GENERIC_DOC_URL || 'https://nsis.sourceforge.io/Docs/AppendixD.html' }}
        run: |
          set -euo pipefail
          msstore settings --enableTelemetry false
          msstore reconfigure --tenantId "$MSSTORE_TENANT_ID" --sellerId "$MSSTORE_SELLER_ID" \
            --clientId "$MSSTORE_CLIENT_ID" --clientSecret "$MSSTORE_CLIENT_SECRET"
          update=$(jq -cn --arg url "$PACKAGE_URL" --arg doc "$GENERIC_DOC_URL" \
            '{packages: [{packageUrl: $url, languages: ["en-us"], architectures: ["X64"],
                          isSilentInstall: false, installerParameters: "/S", genericDocUrl: $doc}]}')
          msstore submission update "$MSSTORE_PRODUCT_ID" "$update"
          msstore submission publish "$MSSTORE_PRODUCT_ID"
          echo "The Microsoft Store submission for $VERSION was sent for certification with $PACKAGE_URL." >> "$GITHUB_STEP_SUMMARY"

  # A draft nobody published serves no update, so this is the step that makes
  # the release real. A failed run leaves the draft unpublished on purpose;
  # `cn release purge` removes it.
  # After every job that uploads to the draft, whatever their results: a
  # published release is sealed, and an upload that arrives after the publish
  # is refused with "already published". The desktop release still goes out
  # when another platform fails; it just waits to be sure.
  publish:
    needs: [verify, windows, macos, linux, android]
    if: >-
      ${{ !cancelled() && !github.event.repository.fork
      && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: publish the release
        uses: crabnebula-dev/cloud-release@1a8803698ba41de6b23e42abc5dcc3721308233c # action-v0.2.6
        with:
          command: >-
            release publish ${{ vars.CN_APPLICATION }} --framework tauri
            ${{ vars.CN_CHANNEL && format('--channel {0}', vars.CN_CHANNEL) || '' }}
          api-key: ${{ secrets.CN_API_KEY }}
          working-directory: apps/desktop
