# The Mac App Store build of a tagged release: the universal app built with
# `--features app-store` (no updater: the store updates it), sandboxed,
# signed with the Apple Distribution certificate, wrapped in a signed
# installer package by `productbuild`, and uploaded to App Store Connect with
# `altool`, after which it appears in TestFlight. Called by
# desktop-release.yml only, and only when the App Store secrets exist.
#
# Source: https://v2.tauri.app/distribute/app-store/ — the provisioning
# profile in `bundle.macOS.files`, the sandbox and team entitlements, the
# universal `--bundles app` build, `xcrun productbuild --sign … --component`
# and `xcrun altool --upload-app --type macos --apiKey --apiIssuer`.
#
# Nothing here goes to GitHub or the Cloud: a Mac App Store package installs
# from the store and nowhere else.
name: release-mac-app-store

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      tauri-cli-version:
        type: string
        required: true

permissions: {}

jobs:
  mac-app-store:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tauri-setup
        with:
          tauri-cli-version: ${{ inputs.tauri-cli-version }}
          targets: x86_64-apple-darwin

      # One .p12 holding both identities the store needs: "Apple Distribution"
      # signs the app, and "3rd Party Mac Developer Installer" (shown as "Mac
      # Installer Distribution" in the developer portal) signs the package.
      - name: import the App Store certificates
        id: identity
        env:
          APPLE_APP_STORE_CERTIFICATE: ${{ secrets.APPLE_APP_STORE_CERTIFICATE }}
          APPLE_APP_STORE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_APP_STORE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/appstore.keychain-db"
          password=$(openssl rand -hex 24)
          printf '%s' "$APPLE_APP_STORE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/appstore.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/appstore.p12" -k "$keychain" \
            -P "$APPLE_APP_STORE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          # Searched before the login keychain, which stays on the list.
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          rm -f "$RUNNER_TEMP/appstore.p12"
          app=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Apple Distribution: .*\)"$/\1/p' | head -1)
          installer=$(security find-identity -v "$keychain" \
            | sed -n 's/.*"\(3rd Party Mac Developer Installer: .*\)"$/\1/p' | head -1)
          if [ -z "$installer" ]; then
            installer=$(security find-identity -v "$keychain" \
              | sed -n 's/.*"\(Mac Installer Distribution: .*\)"$/\1/p' | head -1)
          fi
          if [ -z "$app" ] || [ -z "$installer" ]; then
            echo "APPLE_APP_STORE_CERTIFICATE must hold an Apple Distribution identity and a Mac installer identity" >&2
            security find-identity -v "$keychain" >&2
            exit 1
          fi
          {
            printf 'app=%s\n' "$app"
            printf 'installer=%s\n' "$installer"
            printf 'keychain=%s\n' "$keychain"
          } >> "$GITHUB_OUTPUT"

      # The profile and the two team-scoped entitlements are written into the
      # checkout, which the runner discards: the team never lives in the tree.
      - name: install the provisioning profile and the team entitlements
        env:
          APPLE_APP_STORE_PROVISIONING_PROFILE: ${{ secrets.APPLE_APP_STORE_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          src=apps/desktop/src-tauri
          printf '%s' "$APPLE_APP_STORE_PROVISIONING_PROFILE" | base64 --decode > "$src/appstore.provisionprofile"
          identifier=$(jq -r .identifier "$src/tauri.conf.json")
          /usr/libexec/PlistBuddy \
            -c "Add :com.apple.application-identifier string $APPLE_TEAM_ID.$identifier" \
            -c "Add :com.apple.developer.team-identifier string $APPLE_TEAM_ID" \
            "$src/Entitlements.appstore.plist"
          plutil -lint "$src/Entitlements.appstore.plist"

      # No APPLE_ID or APPLE_API_* here: with either in the environment Tauri
      # would notarize, which a store build neither needs nor wants.
      - name: build the App Store app
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.identity.outputs.app }}
          TAM_ENTITLEMENT_PUBLIC_KEY: ${{ vars.TAM_ENTITLEMENT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          tauri build --target universal-apple-darwin --bundles app --features app-store \
            --config src-tauri/tauri.appstore.conf.json

      - name: package the app for the store
        env:
          INSTALLER: ${{ steps.identity.outputs.installer }}
        run: |
          set -euo pipefail
          app=target/universal-apple-darwin/release/bundle/macos/Teachouse.app
          codesign --display --entitlements - "$app" | grep -q com.apple.security.app-sandbox || {
            echo "the App Store build is not sandboxed" >&2
            exit 1
          }
          mkdir -p mas-artifacts
          xcrun productbuild --sign "$INSTALLER" --component "$app" /Applications \
            "mas-artifacts/Teachouse_${VERSION}_universal.pkg"
          ls -l mas-artifacts

      - name: upload the package to App Store Connect
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          # altool looks for AuthKey_<id>.p8 in ~/private_keys among others.
          mkdir -p "$HOME/private_keys"
          key="$HOME/private_keys/AuthKey_$APPLE_API_KEY.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          xcrun altool --upload-app --type macos \
            --file "mas-artifacts/Teachouse_${VERSION}_universal.pkg" \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
          rm -f "$key"
          echo "The Mac App Store package for $VERSION was uploaded to App Store Connect; it appears in TestFlight once Apple has processed it." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-app-store
          path: mas-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: remove the release keychain
        if: ${{ always() }}
        env:
          KEYCHAIN: ${{ steps.identity.outputs.keychain }}
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -rf "$HOME/private_keys"
