# The Android client (D2's second surface), built on `ubuntu-latest` because
# an Android build has no native-host requirement the way the Windows MSI and
# signtool do (D29). One hand-run job that builds either the debug APK or the
# release APK and keeps it as a workflow artefact.
#
# Nothing here publishes to Play. Tauri automates no part of a Play release and
# the first upload must be made by hand so Play can verify the signature and the
# bundle identifier, which is what D29 already recorded. By default this
# workflow stops at an artefact; `attach_to` is the one exception, and it adds
# an APK to a release that already exists rather than making a release. What the
# founder must supply before a signed release is in
# docs/notes/design/android-client.md.
name: android-build

# Manual build and repair path; tagged releases use desktop-release.yml.
# Without attach_to, the signed APK remains a workflow artefact only.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Which APK to build"
        type: choice
        default: debug
        options:
          - debug
          - release
      attach_to:
        description: "Attach the signed APK to an existing release, e.g. 0.1.3; blank to keep the artefact only"
        type: string
        default: ""

# No permission by default; the one job asks for what it needs and no more.
permissions: {}

# One build at a time per ref and profile; a second dispatch supersedes a
# first, which is what a hand-run build should do.
concurrency:
  group: android-build-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: true

env:
  # The same CLI the dev shell carries (nixpkgs cargo-tauri 2.11.4).
  TAURI_CLI_VERSION: "2.11.4"

jobs:
  apk:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # `secrets` is not a context a step-level `if:` may read, so the two
      # questions the steps ask are answered once, here, as booleans.
      SIGNING: ${{ secrets.ANDROID_KEY_BASE64 != '' }}
      RELEASE: ${{ inputs.profile == 'release' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      # `flake.nix` owns the NDK version and this reads it, so a runner build
      # and a local one compile against one toolchain rather than two.
      - name: read the pinned Android toolchain
        id: pins
        run: sh .github/scripts/android-pins.sh >> "$GITHUB_OUTPUT"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;35.0.0
            ndk;${{ steps.pins.outputs.ndk }}

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          # No `toolchain:` and no `target:`: the action reads
          # rust-toolchain.toml, which already carries aarch64-linux-android,
          # and both profiles build that ABI alone.
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The console is `frontendDist`, so it is built here rather than fetched:
      # this workflow has one job and nothing to hand an artefact to.
      - name: install the wasm-bindgen CLI the crate pins
        run: |
          set -euo pipefail
          version=$(sed -n 's/^wasm-bindgen[[:space:]]*=[[:space:]]*"=\([0-9.]*\)".*/\1/p' \
            crates/tam-core-wasm/Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "no exact wasm-bindgen pin found in crates/tam-core-wasm/Cargo.toml" >&2
            exit 1
          fi
          echo "wasm-bindgen pin: $version"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: build the browser core and the console
        run: |
          set -euo pipefail
          cargo build --target wasm32-unknown-unknown --release --lib -p tam-core-wasm
          wasm-bindgen --target web --out-name core \
            --out-dir web/src/lib/core/generated \
            target/wasm32-unknown-unknown/release/tam_core_wasm.wasm
          cd web
          npm ci --no-audit --no-fund
          npm run build

      # An Android build needs the cargo subcommand, not the npm binary. Tauri's
      # generated Gradle plugin runs `cargo tauri android android-studio-script`
      # with the executable hardcoded as `cargo` and no property to override it
      # (gen/android/buildSrc/src/main/java/io/teachouse/desktop/kotlin/BuildTask.kt,
      # lines 19 and 51), so `cargo-tauri` has to be on the runner however this
      # file invokes the CLI. binstall fetches Tauri's own published binary for
      # the pinned version rather than compiling the crate, which is seconds
      # rather than minutes; it falls back to compiling if the download fails.
      - uses: cargo-bins/cargo-binstall@75b4bfae1b2c753a6806bbce6e6cb89b602de33c # v1.22.0
      - name: install the Tauri CLI
        env:
          CLI_VERSION: ${{ env.TAURI_CLI_VERSION }}
        run: |
          set -euo pipefail
          cargo binstall --no-confirm --locked "tauri-cli@$CLI_VERSION"
          cargo tauri --version

      - name: point the build at the pinned NDK
        env:
          NDK_VERSION: ${{ steps.pins.outputs.ndk }}
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -d "$ndk" ]; then
            echo "the pinned NDK $NDK_VERSION is not at $ndk after setup-android" >&2
            ls -1 "$ANDROID_HOME/ndk" >&2 || true
            exit 1
          fi
          printf 'NDK_HOME=%s\n' "$ndk" >> "$GITHUB_ENV"
          printf 'ANDROID_NDK_ROOT=%s\n' "$ndk" >> "$GITHUB_ENV"

      # Written only for a release, and only when the secret exists. An absent
      # keystore is reported rather than inferred: Gradle then leaves the
      # signing config unset and names the artefact `...-release-unsigned.apk`,
      # so an unsigned build is visible in the filename as well as in the log.
      - name: set up release signing
        if: ${{ env.RELEASE == 'true' }}
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ "$SIGNING" != "true" ]; then
            echo "::warning::ANDROID_KEY_BASE64 is unset; this release APK will be unsigned and Play will refuse it"
            exit 0
          fi
          for name in ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "ANDROID_KEY_BASE64 is set but the $name secret is not" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/keystore.jks"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          properties=apps/desktop/src-tauri/gen/android/keystore.properties
          {
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'password=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'storeFile=%s\n' "$keystore"
          } > "$properties"
          chmod 600 "$properties"
          echo "release signing is configured"

      # arm64 for both profiles, so this hand-run build and the tagged release
      # ship the same ABI set. armv7 returns as its own decision if a seller's
      # phone turns out to need it.
      - name: build the APK
        working-directory: apps/desktop
        env:
          # The keys this build verifies entitlement tokens against. Absent, the
          # build carries none and every gate answers no: tolerable for a debug
          # sideload, and a refusal for a release one, matching the desktop job's
          # own guard. A release APK is a shipped artefact and an `attach_to`
          # input puts it on an existing release, so a warning here would put a
          # client that can never work in front of sellers.
          TAM_ENTITLEMENT_PUBLIC_KEY: ${{ vars.TAM_ENTITLEMENT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ "$RELEASE" = "true" ] && [ -z "${TAM_ENTITLEMENT_PUBLIC_KEY:-}" ]; then
            echo "the TAM_ENTITLEMENT_PUBLIC_KEY repository variable is unset." >&2
            echo "A release APK built without it carries no entitlement key, verifies no" >&2
            echo "token, and every gate answers no. Set the variable, or build the debug" >&2
            echo "profile, which does not ship." >&2
            exit 1
          fi
          if [ "$RELEASE" = "true" ]; then
            cargo tauri android build --apk --ci --target aarch64
          else
            cargo tauri android build --apk --debug --ci --target aarch64
          fi

      - name: collect the artefacts
        id: collect
        run: |
          set -euo pipefail
          outputs=apps/desktop/src-tauri/gen/android/app/build/outputs/apk
          mkdir -p dist
          found=0
          while IFS= read -r apk; do
            cp "$apk" dist/
            found=$((found + 1))
          done < <(find "$outputs" -name '*.apk' -type f)
          if [ "$found" -eq 0 ]; then
            echo "no APK was produced under $outputs" >&2
            exit 1
          fi
          cd dist
          sha256sum ./*.apk > SHA256SUMS.txt
          ls -l
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk-${{ inputs.profile }}-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  # The repair path: put an APK on a release that already exists, so a desktop
  # release whose Android job failed can be completed without spending a new
  # tag. It is a separate job because attaching needs `contents: write` and
  # building does not, and job permissions cannot be made conditional.
  #
  # GitHub is attached first, and that ordering earned itself on the first run:
  # `cn release upload` refuses a published release, so the Cloud step is a
  # recorded skip on this path and the GitHub attachment is the whole repair.
  attach:
    needs: apk
    if: ${{ !github.event.repository.fork && inputs.attach_to != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-apk-${{ inputs.profile }}-${{ github.sha }}
          path: dist

      # `*-release.apk` alone: a debug build or a build whose keystore did not
      # apply leaves `*-debug.apk` or `*-release-unsigned.apk`, matches nothing
      # and stops here rather than attaching something nobody can install.
      - name: name the APK for the release
        id: apk
        env:
          VERSION: ${{ inputs.attach_to }}
        run: |
          set -euo pipefail
          apk=$(find dist -maxdepth 1 -type f -name '*-release.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "no signed release APK in the build artefact; refusing to attach" >&2
            find dist -maxdepth 1 -type f -name '*.apk' >&2 || true
            exit 1
          fi
          named="dist/Teachouse_${VERSION}_arm64.apk"
          if [ "$apk" != "$named" ]; then
            cp "$apk" "$named"
          fi
          printf 'path=%s\n' "$named" >> "$GITHUB_OUTPUT"
          printf 'name=%s\n' "$(basename "$named")" >> "$GITHUB_OUTPUT"

      - name: attach it to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ inputs.attach_to }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$APK" --clobber

      - name: verify the GitHub release carries it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ inputs.attach_to }}
          NAME: ${{ steps.apk.outputs.name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$NAME"; then
            echo "$NAME is not attached to $TAG" >&2
            exit 1
          fi
          echo "$NAME is attached to $TAG"

      # The Cloud accepts assets only while a release is a draft. Uploading to a
      # published one answers "The release was already published", which is the
      # expected outcome here, because this path exists to repair a release that
      # has already gone out; it is recorded and skipped rather than failed. A
      # release still in draft does accept the asset, so the attempt is kept.
      # Every other error still fails the job.
      #
      # `cn` is run directly rather than through the pinned action, which is the
      # one deviation from this repository's action-pinning convention and is
      # confined to this step: the action fails the step on any non-zero exit
      # and discards the message, so the one refusal that must be tolerated
      # cannot be told apart from the ones that must not be. The binary is the
      # same one the action fetches, from the same URL, and the action pins its
      # wrapper rather than the tool in either case.
      - name: upload it to the CrabNebula release
        id: cn
        env:
          CN_API_KEY: ${{ secrets.CN_API_KEY }}
          CN_APPLICATION: ${{ vars.CN_APPLICATION }}
          CN_CHANNEL: ${{ vars.CN_CHANNEL }}
          VERSION: ${{ inputs.attach_to }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          curl -sSL --fail \
            https://cdn.crabnebula.app/download/crabnebula/cn-cli/latest/platform/linux-binary-x86_64 \
            --output cn
          chmod +x cn
          set -- release upload "$CN_APPLICATION" "$VERSION" --file "$APK"
          if [ -n "${CN_CHANNEL:-}" ]; then
            set -- "$@" --channel "$CN_CHANNEL"
          fi
          if output=$(./cn "$@" 2>&1); then
            printf '%s\n' "$output"
            printf 'uploaded=true\n' >> "$GITHUB_OUTPUT"
            echo 'The APK was also uploaded to the CrabNebula release.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s\n' "$output"
          if printf '%s' "$output" | grep -qF 'The release was already published'; then
            printf 'uploaded=false\n' >> "$GITHUB_OUTPUT"
            echo "::notice::CrabNebula refused the asset because the release is already published; the APK is on the GitHub release"
            {
              echo 'No APK on the CrabNebula release: the Cloud accepts assets only while a release is a draft, and this one is published.'
              echo 'The APK is attached to the GitHub release. From the next tag the release workflow uploads it at draft time.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "the CrabNebula upload failed for a reason other than the release already being published" >&2
          exit 1

      - name: read the CrabNebula release back
        id: cnshow
        if: ${{ steps.cn.outputs.uploaded == 'true' }}
        uses: crabnebula-dev/cloud-release@1a8803698ba41de6b23e42abc5dcc3721308233c # action-v0.2.6
        with:
          command: >-
            release show ${{ vars.CN_APPLICATION }} ${{ inputs.attach_to }}
            ${{ vars.CN_CHANNEL && format('--channel {0}', vars.CN_CHANNEL) || '' }}
          api-key: ${{ secrets.CN_API_KEY }}
          working-directory: .

      - name: verify the CrabNebula release names it
        if: ${{ steps.cn.outputs.uploaded == 'true' }}
        env:
          LISTING: ${{ steps.cnshow.outputs.stdout }}
          NAME: ${{ steps.apk.outputs.name }}
        run: |
          set -euo pipefail
          printf '%s\n' "$LISTING"
          if ! printf '%s' "$LISTING" | grep -Fq "$NAME"; then
            echo "the Cloud release does not list $NAME" >&2
            exit 1
          fi
          echo "the Cloud release lists $NAME"
