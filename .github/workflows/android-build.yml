# The Android client (D2's second surface), built on `ubuntu-latest` because
# an Android build has no native-host requirement the way the Windows MSI and
# signtool do (D29). One hand-run job that builds either the debug APK or the
# release APK and keeps it as a workflow artefact.
#
# Nothing here publishes. Tauri automates no part of a Play release and the
# first upload must be made by hand so Play can verify the signature and the
# bundle identifier, which is what D29 already recorded; this workflow stops at
# an artefact. What the founder must supply before a signed release is in
# docs/notes/design/android-client.md.
name: android-build

# Run by hand only. Neither a push to main nor a version tag starts this,
# deliberately and for two separate reasons. An NDK-and-Rust build is twenty
# minutes of a finite Actions budget and is the wrong default for every commit;
# and the desktop `v*.*.*` tag must not also start an Android job that cannot
# yet produce anything usable, because the Android session store is undecided
# and no signing secret exists, so a red Android run would sit beside the
# founder's first desktop release. The tag trigger returns when the Android
# client reaches beta, as its own change.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Which APK to build"
        type: choice
        default: debug
        options:
          - debug
          - release

# No permission by default; the one job asks for what it needs and no more.
permissions: {}

# One build at a time per ref and profile; a second dispatch supersedes a
# first, which is what a hand-run build should do.
concurrency:
  group: android-build-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: true

env:
  # The same CLI the dev shell carries (nixpkgs cargo-tauri 2.11.4).
  TAURI_CLI_VERSION: "2.11.4"
  # The same NDK `flake.nix` pins, so a runner build and a local one compile
  # against one toolchain rather than two.
  ANDROID_NDK_VERSION: "29.0.14206865"

jobs:
  apk:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # `secrets` is not a context a step-level `if:` may read, so the two
      # questions the steps ask are answered once, here, as booleans.
      SIGNING: ${{ secrets.ANDROID_KEY_BASE64 != '' }}
      RELEASE: ${{ inputs.profile == 'release' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;35.0.0
            ndk;29.0.14206865

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          # No `toolchain:` input: the action reads rust-toolchain.toml. It
          # carries one Android triple, because `just check-portable` proves one
          # per surface rather than one per ABI, so the release ABI is added
          # here beside it.
          target: armv7-linux-androideabi
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The console is `frontendDist`, so it is built here rather than fetched:
      # this workflow has one job and nothing to hand an artefact to.
      - name: install the wasm-bindgen CLI the crate pins
        run: |
          set -euo pipefail
          version=$(sed -n 's/^wasm-bindgen[[:space:]]*=[[:space:]]*"=\([0-9.]*\)".*/\1/p' \
            crates/tam-core-wasm/Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "no exact wasm-bindgen pin found in crates/tam-core-wasm/Cargo.toml" >&2
            exit 1
          fi
          echo "wasm-bindgen pin: $version"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: build the browser core and the console
        run: |
          set -euo pipefail
          cargo build --target wasm32-unknown-unknown --release --lib -p tam-core-wasm
          wasm-bindgen --target web --out-name core \
            --out-dir web/src/lib/core/generated \
            target/wasm32-unknown-unknown/release/tam_core_wasm.wasm
          cd web
          npm ci --no-audit --no-fund
          npm run build

      - name: install the Tauri CLI
        env:
          CLI_VERSION: ${{ env.TAURI_CLI_VERSION }}
        run: npm install -g "@tauri-apps/cli@$CLI_VERSION"

      - name: point the build at the pinned NDK
        env:
          NDK_VERSION: ${{ env.ANDROID_NDK_VERSION }}
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -d "$ndk" ]; then
            echo "the pinned NDK $NDK_VERSION is not at $ndk after setup-android" >&2
            ls -1 "$ANDROID_HOME/ndk" >&2 || true
            exit 1
          fi
          printf 'NDK_HOME=%s\n' "$ndk" >> "$GITHUB_ENV"
          printf 'ANDROID_NDK_ROOT=%s\n' "$ndk" >> "$GITHUB_ENV"

      # Written only for a release, and only when the secret exists. An absent
      # keystore is reported rather than inferred: Gradle then leaves the
      # signing config unset and names the artefact `...-release-unsigned.apk`,
      # so an unsigned build is visible in the filename as well as in the log.
      - name: set up release signing
        if: ${{ env.RELEASE == 'true' }}
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ "$SIGNING" != "true" ]; then
            echo "::warning::ANDROID_KEY_BASE64 is unset; this release APK will be unsigned and Play will refuse it"
            exit 0
          fi
          for name in ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "ANDROID_KEY_BASE64 is set but the $name secret is not" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/keystore.jks"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          properties=apps/desktop/src-tauri/gen/android/keystore.properties
          {
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'password=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'storeFile=%s\n' "$keystore"
          } > "$properties"
          chmod 600 "$properties"
          echo "release signing is configured"

      # arm64 only for a debug build, which is a device to install on rather
      # than a release; arm64 and armv7 for a release, which are the two ABIs a
      # phone actually runs.
      - name: build the APK
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          if [ "$RELEASE" = "true" ]; then
            cargo tauri android build --apk --ci --target aarch64 --target armv7
          else
            cargo tauri android build --apk --debug --ci --target aarch64
          fi

      - name: collect the artefacts
        id: collect
        run: |
          set -euo pipefail
          outputs=apps/desktop/src-tauri/gen/android/app/build/outputs/apk
          mkdir -p dist
          found=0
          while IFS= read -r apk; do
            cp "$apk" dist/
            found=$((found + 1))
          done < <(find "$outputs" -name '*.apk' -type f)
          if [ "$found" -eq 0 ]; then
            echo "no APK was produced under $outputs" >&2
            exit 1
          fi
          cd dist
          sha256sum ./*.apk > SHA256SUMS.txt
          ls -l
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk-${{ inputs.profile }}-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
