<!doctype html>
<meta charset="utf-8" />
<title>Teachouse</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* The founder's brand kit, written out rather than imported: this page is
     served from the desktop app's own bundle when the console cannot be
     reached, so it has no stylesheet, no font and no network. Each of the six
     below is the token of the same name in web/src/lib/styles/tokens.css, and
     every literal outside these two blocks is named where it stands. All of
     it is checked against that file by tokens.test.ts, so a palette edit that
     leaves this page behind fails the lane rather than shipping.

     Dark reached through the media query and not through the attribute the
     console uses: this page has no script and no storage, so the machine's
     own preference is the only signal it has. A seller who chose Light in a
     console they cannot currently reach therefore gets the dark card on a
     dark machine, which is the closest a page with nothing to read can come.

     No webfont either, so Poppins and Inter are named in the stacks and
     whatever the machine has answers instead. */
  :root {
    --ground: #f8faf8;
    --surface: #ffffff;
    --primary: #1e2a5a;
    --text: #2d3748;
    --muted: #64748b;
    --line: #e2e8f0;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #141414;
      --surface: #1c1c1e;
      --primary: #c8b4ff;
      --text: #f4f4f5;
      --muted: #b9b9c0;
      --line: #333337;
      color-scheme: dark;
    }
    /* The three rules that spell a colour out rather than reading a token
       are overridden at the foot of this sheet, not here: they are ordinary
       declarations of the same specificity as the ones they replace, so
       source order is what decides them. */
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--ground);
    color: var(--text);
    font:
      15px/1.6 "Inter",
      "Segoe UI",
      system-ui,
      -apple-system,
      sans-serif;
  }
  main {
    width: 100%;
    max-width: 30rem;
    box-sizing: border-box;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    /* --sh-2: --text at 8 percent. Written as rgba rather than color-mix,
       which the bundled webview may predate. */
    box-shadow: 0 4px 14px rgba(45, 55, 72, 0.08);
    padding: 28px;
  }
  .mark {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
    font-size: 19px;
    font-weight: 600;
    color: var(--primary);
    margin-bottom: 20px;
  }
  .mark svg {
    display: block;
    width: 28px;
    height: 28px;
    flex: none;
  }
  h1 {
    font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--primary);
    margin: 0 0 8px;
  }
  p {
    margin: 0 0 14px;
    color: var(--muted);
    font-size: 13.5px;
  }
  button {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 0 18px;
    min-height: 40px;
    /* --r-pill: every button in this console is a pill. */
    border-radius: 999px;
    border: 1px solid var(--primary);
    background: var(--primary);
    /* --on-fill: the ink a filled control carries. */
    color: #fff;
    cursor: pointer;
    width: 100%;
  }
  button:disabled {
    /* --soon-soft and --soon: the disabled fill and ink the console's own
       buttons take. Not in :root above because nothing else on this page
       reads them. */
    background: #eef1f7;
    border-color: var(--line);
    color: #64748b;
    cursor: default;
  }
  #outcome {
    min-height: 1.6em;
    margin: 12px 0 0;
    font-size: 13px;
    color: var(--primary);
  }
  /* The dark half of the three rules above that spell a colour out. Last in
     the sheet because each is an ordinary declaration of the same
     specificity as the one it replaces, and source order is what decides
     between them; written beside the token name each one copies. */
  @media (prefers-color-scheme: dark) {
    button {
      /* --on-fill */
      color: #1e2a5a;
    }
    button:disabled {
      /* --soon-soft and --soon */
      background: #26262a;
      color: #a1a1aa;
    }
    .mark svg rect {
      /* --text. The mark's tile is Indigo, which on this charcoal card is
         dark on dark. The house keeps its Teal. */
      fill: #f4f4f5;
    }
  }
</style>
<main>
  <div class="mark">
    <!-- A copy of web/static/brand/mark.svg, which web/static/favicon.svg is a
         byte copy of: the house on its indigo tile, in the kit's two colours
         and nothing else. Change it there and copy it here. tokens.test.ts
         holds the two files to the same set of colours. -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 96 96"
      aria-hidden="true"
    >
      <rect width="96" height="96" fill="#1e2a5a" rx="22" />
      <svg width="64" height="68" x="16" y="14" viewBox="0 0 720 760">
        <path
          fill="#00b894"
          d="M341.3 24.5c-10 2.4-12.6 4.1-44.9 29.3L279 67.4l-16 12.8a688 688 0 0 0-19 15.4c-4.7 3.8-11 8.7-14 10.7s-9.1 6.7-13.5 10.4a783 783 0 0 1-22 17.5 1207 1207 0 0 0-30.1 24 1319 1319 0 0 1-37.8 30.2c-3.3 2.8-10.3 8.2-15.5 12.2-5.3 3.9-12.5 9.7-16.1 12.8s-8.3 7.1-10.5 8.7c-41.2 30.7-46.9 36.6-49.5 51.8a47 47 0 0 0 10.8 38.4 53 53 0 0 0 24 14.1c5.4 2 17.1 2.1 21.9.1 1.9-.8 4.8-1.5 6.4-1.5 2.9 0 2.9 0 3 18.7l.2 178.3c.2 159.5.2 159.5 2.3 164.1a35 35 0 0 0 14.2 14.7c4.1 2.1 5.2 2.2 35.1 2.2 27.4 0 31.3-.2 34.7-1.8a26 26 0 0 0 12.2-9.6c6.8-9.4 6.6-7.5 7.2-67.6.5-54.5.5-54.5 3.4-60.2a45 45 0 0 1 19.4-20c6.7-3.3 6.7-3.3 123.2-3.3 112.4 0 116.7.1 121.5 1.9a41 41 0 0 1 23.8 26.1q1.1 3.2 1.6 59c.7 62.9-.1 57.2 8.5 66.3s9.3 9.2 43.6 9.2c34 0 34.1 0 42.8-8.4a28 28 0 0 0 9-16.1c.7-3.4 1-60.2 1-178.3 0-127 .3-173.7 1.1-174.5s2.3-.7 5.9.3a47 47 0 0 0 60.2-44.5c0-6.6-2.5-17.3-4.6-19.6a5 5 0 0 1-1.4-2.7c0-2.1-11.4-12.6-23.5-21.7-19.2-14.4-36.4-28.5-37-30.4-.3-.9-.7-25.5-.9-54.6-.5-58.9-.4-58.4-7.1-65-6.5-6.6-9-7-39-7-30.5 0-32.2.3-38.2 5.8-7.3 6.7-7.7 7.9-8.1 27.9A103 103 0 0 1 511 132a59 59 0 0 1-12.9-9 289 289 0 0 0-20.6-16c-2.7-1.9-9-6.8-14-11A512 512 0 0 0 444 80.5c-5.8-4.4-16.1-12.5-23-18a501 501 0 0 0-48-35.3 51 51 0 0 0-31.7-2.7m17.9 113.4a110 110 0 0 1 8.5 6.3c2.1 1.9 8.4 7 14.1 11.4l25.5 19.6 23.5 18 23 17.8c8.1 6.4 20.8 16.1 28.2 21.7s14.4 11.1 15.5 12.3c3 3.3 2.9 208.5-.1 210.7-2.3 1.7-285.3 2-288.5.3-1.9-1-1.9-3.3-1.9-104.8 0-57 .4-104.2.8-104.9 1.1-1.7 18.8-15.8 25.2-20.1 3-2 9.6-7 14.5-11.2s12.8-10.2 17.5-13.5c4.7-3.2 15.9-11.8 25-19s22.1-17.3 29-22.5 14.5-11.2 17-13.6a55 55 0 0 1 16.9-11.4c.9 0 3.8 1.3 6.3 2.9m-48.1 148c-14.3.6-14.3.6-17.2 4.1s-2.9 3.4-2.9 21.3 0 17.9 3.9 21.8 3.9 3.9 23.8 3.9c27.8 0 26.8 1 26.8-25.4 0-19.6 0-19.6-2.6-22.1-2.8-2.9-8.4-4.6-13.9-4.3zm67.8-.2c-10.3.4-10.7.5-13.5 3.4-2.9 3-2.9 3-3.2 22-.4 18.9-.4 18.9 3.1 22.4s3.5 3.5 23.2 3.5 19.7 0 23.1-3.4 3.4-3.4 3.4-22 0-18.6-3.2-22.1c-3.2-3.4-3.5-3.4-12.8-3.8-5.2-.2-14.3-.2-20.1 0m-81.5 68.7c-6 2.7-6.4 4.2-6.4 23.9 0 18.7.3 20.1 4.8 24.9 2.6 2.8 2.6 2.8 23 2.8 27.2 0 25.6 1.4 26.6-24 .8-19.9.5-21.9-3.9-26-2.6-2.5-2.9-2.5-21.8-2.8-14.9-.2-19.9.1-22.3 1.2m70.6-.1c-5.7 2-6.1 3.8-5.8 26 .4 26.9-.8 25.7 26.9 25.7s27.3.5 26.5-31c-.6-22.8.2-22-25.4-21.9-11.7 0-20 .5-22.2 1.2"
        />
      </svg>
    </svg>
    Teachouse
  </div>
  <h1 id="heading">Opening Teachouse</h1>
  <p id="explanation">Connecting to your workspace.</p>
  <p>Your marketplace sign-ins stay on this device.</p>
  <button id="retry" type="button">Try again</button>
  <p id="outcome" role="status"></p>
</main>
<script>
  const button = document.getElementById("retry");
  const outcome = document.getElementById("outcome");
  const heading = document.getElementById("heading");
  const explanation = document.getElementById("explanation");
  async function openConsole() {
    const invoke = window.__TAURI__?.core?.invoke;
    if (!invoke) {
      heading.textContent = "Teachouse could not be opened";
      explanation.textContent = "Please close and reopen the app.";
      return;
    }
    button.disabled = true;
    heading.textContent = "Opening Teachouse";
    outcome.textContent = "Connecting…";
    try {
      await invoke("retry_console");
      outcome.textContent = "Connected. Opening Teachouse…";
    } catch (why) {
      heading.textContent = "Teachouse could not be reached";
      explanation.textContent = "Check your connection, then try again.";
      outcome.textContent =
        typeof why === "string" ? why : "Still could not reach Teachouse.";
      button.disabled = false;
    }
  }
  button.addEventListener("click", openConsole);
  // The document owns navigation: a setup-time location.replace can be lost
  // before the Android WebView finishes loading its first local page.
  void openConsole();
</script>
