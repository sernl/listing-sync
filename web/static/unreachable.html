<!doctype html>
<meta charset="utf-8" />
<title>Teachouse</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 2rem;
  }
  main { max-width: 34rem; }
  h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
  p { margin: 0 0 1rem; }
  button {
    font: inherit; padding: 0.6rem 1.1rem; border-radius: 0.5rem;
    border: 1px solid currentColor; background: transparent; color: inherit;
    cursor: pointer;
  }
  #outcome { min-height: 1.6em; margin-top: 1rem; }
</style>
<main>
  <h1>Teachouse could not be reached</h1>
  <p>
    Your work is safe. Nothing has been lost and nothing was sent. This
    usually means the network is down or the service is briefly unavailable.
  </p>
  <p>
    Your marketplace sign-ins stay on this computer either way, so nothing
    about them depends on reaching us.
  </p>
  <button id="retry" type="button">Try again</button>
  <p id="outcome" role="status"></p>
</main>
<script>
  const button = document.getElementById('retry');
  const outcome = document.getElementById('outcome');
  button.addEventListener('click', async () => {
    const invoke = window.__TAURI__?.core?.invoke;
    if (!invoke) {
      outcome.textContent = 'Please close and reopen the app.';
      return;
    }
    button.disabled = true;
    outcome.textContent = 'Trying…';
    try {
      await invoke('retry_console');
      outcome.textContent = 'Connected. Opening Teachouse…';
    } catch (why) {
      outcome.textContent =
        typeof why === 'string' ? why : 'Still could not reach Teachouse.';
      button.disabled = false;
    }
  });
</script>
