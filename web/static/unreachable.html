<!doctype html>
<meta charset="utf-8" />
<title>Teachouse</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* Kauri, written out rather than imported: this page is served from the
     desktop app's own bundle when the console cannot be reached, so it has
     no stylesheet, no font and no network. Each of the seven below is the
     token of the same name in web/src/lib/styles/tokens.css; every literal
     outside this block is named where it stands, because a palette edit will
     move the tokens and cannot move these. */
  :root {
    --ground: #f7f2e9;
    --surface: #fffdf9;
    --primary: #6b4423;
    --accent-ink: #a5462f;
    --text: #241a12;
    --muted: #726254;
    --line: #e4d8c4;
    color-scheme: light;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--ground);
    color: var(--text);
    font: 15px/1.6 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  main {
    width: 100%;
    max-width: 30rem;
    box-sizing: border-box;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    /* --sh-2: --text at 8 percent. Written as rgba rather than color-mix,
       which the bundled webview may predate. */
    box-shadow: 0 4px 14px rgba(36, 26, 18, 0.08);
    padding: 28px;
  }
  .mark {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 19px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .mark svg {
    display: block;
    width: 28px;
    height: 28px;
    flex: none;
  }
  h1 {
    font-family: 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
  }
  p {
    margin: 0 0 14px;
    color: var(--muted);
    font-size: 13.5px;
  }
  button {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 0 18px;
    min-height: 40px;
    border-radius: 999px;
    border: 1px solid var(--primary);
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    width: 100%;
  }
  button:disabled {
    /* --soon-soft and --soon: the disabled fill and ink the console's own
       buttons take. Not in :root above because nothing else on this page
       reads them. */
    background: #efeae1;
    border-color: var(--line);
    color: #6e655d;
    cursor: default;
  }
  #outcome {
    min-height: 1.6em;
    margin: 12px 0 0;
    font-size: 13px;
    color: var(--accent-ink);
  }
</style>
<main>
  <div class="mark">
    <!-- A verbatim copy of web/static/favicon.svg, which is the mark's own
         source of truth rather than the palette's: three of its four colours
         happen to equal --primary, --ground and --accent, and #F2E9DA is the
         shaded second page of the book, which is the mark's alone and matches
         no token. Change it there and copy it here; do not retint it from
         tokens.css. -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" aria-hidden="true">
      <rect width="96" height="96" rx="22" fill="#6B4423" />
      <path
        d="M15 46 L48 19 L81 46"
        fill="none"
        stroke="#F7F2E9"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle cx="48" cy="19" r="5.5" fill="#C2543A" />
      <path d="M45 58 C39 54 30 52.5 22 54 L22 74 C30 72.5 39 74 45 78 Z" fill="#F7F2E9" />
      <path d="M51 58 C57 54 66 52.5 74 54 L74 74 C66 72.5 57 74 51 78 Z" fill="#F2E9DA" />
      <path d="M48 58 L48 78" fill="none" stroke="#C2543A" stroke-width="3" stroke-linecap="round" />
    </svg>
    Teachouse
  </div>
  <h1>Teachouse could not be reached</h1>
  <p>
    Your work is safe. Nothing has been lost and nothing was sent. This usually means the
    network is down or the service is briefly unavailable.
  </p>
  <p>
    Your marketplace sign-ins stay on this computer either way, so nothing about them
    depends on reaching us.
  </p>
  <button id="retry" type="button">Try again</button>
  <p id="outcome" role="status"></p>
</main>
<script>
  const button = document.getElementById('retry');
  const outcome = document.getElementById('outcome');
  button.addEventListener('click', async () => {
    const invoke = window.__TAURI__?.core?.invoke;
    if (!invoke) {
      outcome.textContent = 'Please close and reopen the app.';
      return;
    }
    button.disabled = true;
    outcome.textContent = 'Trying…';
    try {
      await invoke('retry_console');
      outcome.textContent = 'Connected. Opening Teachouse…';
    } catch (why) {
      outcome.textContent =
        typeof why === 'string' ? why : 'Still could not reach Teachouse.';
      button.disabled = false;
    }
  });
</script>
