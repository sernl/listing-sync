<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-label="A teacher-like figure with a satchel handing a book to someone at their door">
  <defs>
    <!-- one fern frond, base at the origin, growing upward -->
    <g id="frond" fill="#3E7A4E">
      <path d="M-5 0 L-5 -130 Q-5 -139 0 -139 Q5 -139 5 -130 L5 0 Z" />
      <ellipse cx="-26" cy="-26" rx="26" ry="9" transform="rotate(20 -26 -26)" />
      <ellipse cx="26" cy="-26" rx="26" ry="9" transform="rotate(-20 26 -26)" />
      <ellipse cx="-23" cy="-56" rx="23" ry="8" transform="rotate(20 -23 -56)" />
      <ellipse cx="23" cy="-56" rx="23" ry="8" transform="rotate(-20 23 -56)" />
      <ellipse cx="-19" cy="-84" rx="19" ry="7" transform="rotate(20 -19 -84)" />
      <ellipse cx="19" cy="-84" rx="19" ry="7" transform="rotate(-20 19 -84)" />
      <ellipse cx="-13" cy="-108" rx="14" ry="6" transform="rotate(20 -13 -108)" />
      <ellipse cx="13" cy="-108" rx="14" ry="6" transform="rotate(-20 13 -108)" />
    </g>
  </defs>

  <rect width="1040" height="520" fill="#F7F2E9" />

  <circle cx="858" cy="118" r="92" fill="#F8EFDA" />

  <g fill="#FFFDF9">
