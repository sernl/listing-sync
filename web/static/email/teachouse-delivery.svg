    <ellipse cx="250" cy="126" rx="46" ry="24" />
    <ellipse cx="152" cy="128" rx="40" ry="22" />
    <ellipse cx="404" cy="76" rx="46" ry="21" />
    <ellipse cx="440" cy="82" rx="32" ry="17" />
  </g>

  <!-- three ranges, palest and furthest first -->
  <path d="M0 300 Q160 214 340 282 Q520 348 700 262 Q860 186 1040 268 L1040 520 L0 520 Z" fill="#E7ECF5" />
  <path d="M0 352 Q200 282 400 340 Q600 396 800 330 Q930 288 1040 330 L1040 520 L0 520 Z" fill="#D6DCCD" />
  <path d="M0 404 Q180 356 380 398 Q560 436 760 404 Q900 382 1040 404 L1040 520 L0 520 Z" fill="#BCCBB7" />
  <path d="M0 446 Q300 430 560 444 Q800 456 1040 440 L1040 520 L0 520 Z" fill="#ECE1CD" />
  <path d="M172 520 Q470 476 812 466 L906 474 Q520 494 336 520 Z" fill="#F2E9DA" />

  <!-- the house at the end of the path, bleeding off the right edge -->
  <g>
    <path d="M660 200 L856 62 L1052 200 Z" fill="#C2543A" />
    <rect x="700" y="192" width="344" height="262" fill="#FFFDF9" stroke="#E4D8C4" stroke-width="5" />
    <rect x="952" y="248" width="76" height="76" rx="6" fill="#F8EFDA" stroke="#6B4423" stroke-width="7" />
    <path d="M990 248 L990 324 M952 286 L1028 286" stroke="#6B4423" stroke-width="6" />
    <rect x="806" y="252" width="128" height="202" rx="6" fill="#E4D8C4" />
    <rect x="814" y="260" width="112" height="194" fill="#6B4423" />
    <!-- someone answering the door, framed by the opening -->
    <path d="M816 454 L816 414 Q816 380 844 380 Q872 380 872 414 L872 454 Z" fill="#C2543A" />
    <circle cx="844" cy="348" r="26" fill="#ECE1CD" />
    <path d="M818 348 A26 26 0 0 1 870 348 Z" fill="#6B4423" />
    <circle cx="835" cy="356" r="3" fill="#241A12" />
    <circle cx="851" cy="356" r="3" fill="#241A12" />
    <!-- the door itself, swung inward -->
    <rect x="874" y="260" width="52" height="194" fill="#F2E9DA" stroke="#E4D8C4" stroke-width="4" />
    <circle cx="886" cy="358" r="6" fill="#6B4423" />
    <rect x="778" y="454" width="190" height="20" rx="4" fill="#ECE1CD" stroke="#7C6B5B" stroke-width="4" />
    <rect x="754" y="474" width="238" height="20" rx="4" fill="#F2E9DA" stroke="#7C6B5B" stroke-width="4" />
  </g>

  <!-- letterbox on the verge -->
  <g>
    <rect x="286" y="370" width="18" height="112" rx="6" fill="#6B4423" />
    <rect x="248" y="316" width="96" height="62" rx="12" fill="#C2543A" />
    <rect x="266" y="340" width="60" height="10" rx="5" fill="#F2E9DA" />
    <rect x="344" y="322" width="10" height="36" rx="5" fill="#3E5A8C" />
  </g>

  <!-- the courier: satchel, one book held out toward the threshold -->
  <g>
    <rect x="510" y="336" width="32" height="136" rx="16" fill="#6B4423" />
    <rect x="578" y="336" width="32" height="136" rx="16" fill="#6B4423" />
    <rect x="496" y="462" width="58" height="22" rx="11" fill="#241A12" />
    <rect x="566" y="462" width="58" height="22" rx="11" fill="#241A12" />
    <rect x="556" y="192" width="26" height="30" fill="#ECE1CD" />
    <path d="M520 244 Q520 212 552 208 L588 208 Q620 212 620 244 L628 340 Q630 354 616 354 L524 354 Q510 354 512 340 Z" fill="#3E5A8C" />
    <path d="M604 220 L504 334" stroke="#C2543A" stroke-width="14" stroke-linecap="round" />
    <path d="M602 248 L684 274" stroke="#3E5A8C" stroke-width="30" stroke-linecap="round" />
    <ellipse cx="569" cy="212" rx="35" ry="12" fill="#C2543A" />
    <circle cx="569" cy="170" r="42" fill="#ECE1CD" />
    <path d="M527 170 A42 42 0 0 1 611 170 Z" fill="#6B4423" />
    <circle cx="523" cy="156" r="17" fill="#6B4423" />
    <circle cx="583" cy="181" r="4" fill="#241A12" />
    <circle cx="600" cy="181" r="4" fill="#241A12" />
    <g>
      <rect x="470" y="300" width="32" height="26" rx="3" fill="#FFFDF9" stroke="#E4D8C4" stroke-width="3" transform="rotate(-9 486 313)" />
      <rect x="506" y="294" width="32" height="30" rx="3" fill="#F7E7E1" stroke="#E4D8C4" stroke-width="3" transform="rotate(7 522 309)" />
      <rect x="458" y="314" width="96" height="80" rx="12" fill="#C2543A" />
      <path d="M458 326 Q458 314 470 314 L542 314 Q554 314 554 326 L554 352 L458 352 Z" fill="#9E3423" />
      <rect x="494" y="344" width="22" height="15" rx="4" fill="#F2E9DA" />
    </g>
    <g transform="rotate(-10 744 250)">
      <rect x="692" y="212" width="104" height="76" rx="8" fill="#FFFDF9" stroke="#E4D8C4" stroke-width="5" />
      <path d="M700 212 L714 212 L714 288 L700 288 Q692 288 692 280 L692 220 Q692 212 700 212 Z" fill="#6B4423" />
      <rect x="730" y="234" width="48" height="7" rx="3.5" fill="#E4D8C4" />
      <rect x="730" y="252" width="34" height="7" rx="3.5" fill="#E4D8C4" />
      <rect x="766" y="212" width="13" height="42" fill="#C2543A" />
    </g>
    <circle cx="692" cy="277" r="16" fill="#ECE1CD" />
  </g>

  <use href="#frond" transform="translate(108 518) rotate(-14) scale(1.05)" />
  <use href="#frond" transform="translate(196 520) rotate(13) scale(0.76)" />
  <use href="#frond" transform="translate(1004 512) rotate(15) scale(0.88)" />
  <circle cx="66" cy="470" r="9" fill="#C2543A" />
  <circle cx="234" cy="480" r="7" fill="#C2543A" />
</svg>
