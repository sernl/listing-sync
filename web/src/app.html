<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>Teachouse Console</title>
    <!-- No font link and no preconnect: both faces are served from
         `static/fonts` and declared in `app.css`. The desktop and Android
         builds show this same document under a policy that admits no
         third-party origin, so the two stylesheets these replace were refused
         there and the app fell back to the stacks in `tokens.css`. -->
    <!-- PNG before any other icon: at 16 px a rasterised glyph stays crisp where
         a scaled-down SVG goes muddy, and browsers take the first match they
         understand. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
