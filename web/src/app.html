<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` resolve to
         anything but zero. Three clearances already spend it — the tab bar, the
         bulk bar and the bottom sheet — and edge-to-edge is mandatory from
         Android 15 (API 35) up, which this app's `targetSdk = 36` (Android 16)
         is above, so without this a browser draws under both system bars and
         the written clearances are inert. `shell.css` carries the matching top
         inset on `.app`, and records what the Android 16 build measured: there
         the meta itself changes nothing. -->
    <title>Teachouse Console</title>
    <!-- No font link and no preconnect: both faces are served from
         `static/fonts` and declared in `app.css`. The desktop and Android
         builds show this same document under a policy that admits no
         third-party origin, so the two stylesheets these replace were refused
         there and the app fell back to the stacks in `tokens.css`. -->
    <!-- The PNG icons and no SVG link, which is a decision rather than an
         omission and still holds under the brand kit: `favicon-16.png` is
         rendered from `brand/mark-small.svg`, the mark drawn with its window
         closed for that size, and an SVG link would hand 16 px back to the
         full mark because a browser that understands the format prefers it.
         `docs/notes/design/product-icon.md` records the whole set. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <!-- The palette, decided before the stylesheet so the first paint is
         already the right colour. Inline and not a module, because a
         `<script src>` here is a round trip the page would spend flashing
         Cream at a seller who asked for Indigo, and an ordinary deferred
         module runs after paint. `tam-server` hashes every inline block of
         the page it actually serves into the policy it sends
         (`serving::inline_script_hashes`), so this needs no grant added by
         hand.

         The attribute on `<html>` above is the no-script answer and the
         reason `tokens.css` pins `color-scheme` per theme rather than leaving
         it to `light dark`: whatever happens here, the element carries
         exactly one of the two words.

         This is `web/src/lib/theme.ts` run early, and it cannot import it:
         the module graph is what this script exists to get ahead of.
         `theme.test.ts` compares the key and the query written here against
         that module's constants, so a rename cannot land in one of them. -->
    <script>
      (function () {
        var key = 'teachouse.theme';
        var query = '(prefers-color-scheme: dark)';
        var media = window.matchMedia ? window.matchMedia(query) : null;
        var paint = function () {
          var chosen;
          try {
            chosen = localStorage.getItem(key);
          } catch (refused) {
            // Storage disabled, which is a browser setting and not a fault.
            chosen = null;
          }
          if (chosen !== 'light' && chosen !== 'dark') {
            chosen = media && media.matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = chosen;
        };
        paint();
        // The choice is re-read on every system change rather than captured
        // once, so a seller who picks Dark keeps it when the machine turns
        // light at sunrise, and one who picks System follows it back.
        if (media) {
          if (media.addEventListener) media.addEventListener('change', paint);
          else if (media.addListener) media.addListener(paint);
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
