[workspace]
resolver = "2"
members = ["crates/tam-limits", "crates/ban-probe", "crates/tam-types", "crates/tam-marketplace", "crates/tam-marketplace-tes", "crates/tam-marketplace-tpt", "crates/tam-domain", "crates/tam-authoring", "crates/tam-core-wasm", "crates/tam-secrets", "crates/tam-pipeline", "crates/tam-storage", "crates/tam-taxonomy", "crates/tam-taxonomy-seed", "crates/tam-vocab-drift", "crates/tam-mint-session", "crates/tam-entitlement-key", "crates/tam-admin", "crates/tam-import",
    "crates/tam-engine",
    "crates/tam-engine-driver",
    "crates/tam-canary",
    "crates/tam-analytics",
    "crates/tam-pipeline-worker",
    "crates/tam-worker", "crates/tam-sync-worker", "crates/tam-api", "crates/tam-server",
    "crates/tam-standards", "crates/tam-standards-crawl", "crates/tam-standards-fetch",
    "apps/desktop/src-tauri",
    "apps/extension"]

# Pinned once for the crates that must agree on it. `sha2` produces the
# `SubmitEvidence` body digest, which is the write-evidence contract every
# adapter answers in the same bytes, so the version is not a per-crate
# choice.
[workspace.dependencies]
sha2 = "0.10"

# The other two primitives one Paddle webhook verification runs on, pinned
# beside the hash it uses for the reason that pin exists: `hmac` keys the
# SHA-256 above, and `subtle` supplies the comparison that does not branch on
# the digest. A verifier assembled from three crates that disagreed on a
# version would be a verifier whose behaviour depends on which crate resolved
# first.
hmac = "0.12"
subtle = "2.6"

# The Markdown-to-HTML renderer the Tes-to-TPT body carriage runs through,
# pinned here for the reason above: one Markdown body must render to one HTML
# body on every path that renders it, and a per-crate version is how two paths
# stop agreeing without anyone editing either. `default-features = false`
# drops `getopts`, which exists for the crate's own command-line binary.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# The two halves of the spreadsheet import, founder-approved on 2026-09-05 and
# pinned exactly rather than by caret. A workbook this repository generates and
# then reads back is one file format crossing two crates, and a caret range
# lets the reader and the writer move independently between a `cargo update`
# and the golden-template test that holds them together.
#
# Both are pure Rust with empty default feature sets, which is why neither
# carries `default-features = false`: there is nothing to switch off. The
# writer's `zlib` feature routes deflate through a C library and stays off;
# the reader's `dates` feature pulls `chrono`, and no cell this import reads is
# a date.
calamine = "=0.36.1"
rust_xlsxwriter = "=0.99.0"

[workspace.lints.rust]
unsafe_code                = "forbid"
rust_2018_idioms           = { level = "deny", priority = -1 }
unused_must_use            = "deny"
let_underscore_drop        = "deny"
unreachable_pub            = "deny"
trivial_casts              = "deny"
elided_lifetimes_in_paths  = "deny"
unused_lifetimes           = "deny"

[workspace.lints.clippy]
all      = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Pedantic exceptions. In a railway-oriented codebase where nearly every
# function returns Result, the doc lints demand a paragraph per function for
# no defect yield. `wildcard_imports` is deliberately NOT here: it is the one
# pedantic lint whose purpose is making a name's provenance visible in the
# file that uses it, which is worth more to an agent than to a human.
missing_errors_doc          = "allow"
missing_panics_doc          = "allow"
doc_markdown                = "allow"
module_name_repetitions     = "allow"

# Hand-picked from `restriction`; never enable that group wholesale.
unwrap_used                 = "deny"
expect_used                 = "deny"
panic                       = "deny"
todo                        = "deny"
unimplemented               = "deny"
unreachable                 = "deny"
integer_division            = "deny"
string_slice                = "deny"
dbg_macro                   = "deny"
mem_forget                  = "deny"
exit                        = "deny"
infinite_loop               = "deny"
missing_assert_message      = "deny"

# Async and concurrency hazards.
let_underscore_must_use     = "deny"
let_underscore_future       = "deny"
await_holding_lock          = "deny"
await_holding_refcell_ref   = "deny"
async_yields_async          = "deny"
significant_drop_tightening = "deny"
unused_async                = "deny"
large_futures               = "deny"

# Structure and exhaustiveness.
wildcard_enum_match_arm     = "deny"
missing_asserts_for_indexing = "deny"
disallowed_methods          = "deny"
disallowed_types            = "deny"
disallowed_macros           = "deny"

# Advisory: allowed here, raised in the second clippy invocation.
too_many_lines              = "allow"
type_complexity             = "allow"
cognitive_complexity        = "allow"

# Deliberate allows, argued in charter section 4.
must_use_candidate          = "allow"
panic_in_result_fn          = "allow"
indexing_slicing            = "allow"

# wry 0.55.1, with four Android fixes and nothing else. Without them the
# Android client aborts before its first frame on every fresh install, and the
# debug and release builds abort for different reasons: `getCookies` declares a
# non-null return over `CookieManager.getCookie`, which is null when the jar
# holds no cookie for the origin, while in a minified build R8 removes
# `getCookies` outright because wry's own keep rules omit it. Either way the
# resulting JNI exception is swallowed without being cleared, so ART kills the
# process at the next JNI call. `vendor/README.md` carries the three diffs, the
# evidence and the condition under which this entry is removed.
[patch.crates-io]
wry = { path = "vendor/wry-0.55.1" }

[profile.release]
overflow-checks = true
debug-assertions = true
