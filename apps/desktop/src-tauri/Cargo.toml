[package]
name        = "tam-desktop"
version     = "0.2.0"
edition     = "2021"
publish     = false
description = "The Teachouse desktop client: the seller's device, where every no-API marketplace request originates"

[lib]
name = "tam_desktop"
path = "src/lib.rs"
# `cdylib` is what an Android `System.loadLibrary` opens, and Gradle has
# nothing to package without it; `staticlib` is the iOS half of the same
# requirement. `rlib` stays first-class because the binary and the tests link
# the library normally.
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "teachouse"
path = "src/main.rs"

[features]
# Set by `cargo tauri build`. With it on, `generate_context!` embeds the
# frontend rather than pointing the webview at the dev server; removing it
# makes a release bundle that loads nothing.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri               = { version = "2.11", features = [] }
tauri-plugin-os     = "2.3"
tauri-plugin-updater = "2.11"

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# `fs` is the interim payload cache: the bytes an upload needs come down from
# the control plane, are verified against the envelope's digest, live in one
# directory for the length of one run, and are removed when the item settles.
tokio      = { version = "1", features = ["time", "rt", "sync", "fs"] }
uuid       = { version = "1", features = ["v4"] }

# The digest the payload fetch is checked against. Blake3 because that is what
# the ingest pipeline computed and what the blob is keyed on, and `pure` for
# the same founder decision `tam-pipeline` records: it drops the C and asm
# paths, so this cross-compiles to Windows without a C toolchain. The crate
# and the feature are already in the workspace tree, so the two resolve to one
# build.
blake3     = { version = "1", features = ["pure"] }

# The entitlement token is a compact JWS with `alg: EdDSA`, which is the
# format and the crate `tam-api` already verifies better-auth's assertions
# with; a second signature stack would be a second thing to get wrong.
jsonwebtoken = { version = "9.3", default-features = false }

# This device's own HTTP to our control plane, which is the registry check-in
# and nothing else: no marketplace request is ever composed here, and D1 keeps
# it that way. The edge is inherent rather than optional, because a device that
# cannot reach the control plane cannot learn it has been revoked.
#
# Version 0.13 rather than the 0.12 the server crates pin, deliberately:
# tauri-plugin-updater already puts 0.13.4 in this binary, so this adds an edge
# to a package that is present rather than a second HTTP and TLS stack in a
# client whose bundle size we measure.
#
# `rustls-no-provider` rather than `rustls`, and the difference is not
# cosmetic. In 0.13, `rustls = ["__rustls-aws-lc-rs", ...]` forces the
# aws-lc-rs provider, which drags aws-lc-sys and a cmake C build into a binary
# we cross-compile to Windows -- the exact class of dependency that already
# needed an unwrapped-clang workaround for `ring`. `rustls-no-provider` is the
# same TLS stack without a forced provider, and is what tauri-plugin-updater
# already enables here, so this edge adds no package at all.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
] }

# The crypto provider that TLS stack runs on, named rather than inherited.
# `rustls-no-provider` makes `Client::build()` panic outright unless a default
# provider is already installed, and the only thing that installs one today is
# tauri-plugin-updater, lazily, inside its own update check
# (tauri-plugin-updater 2.11.0, src/updater.rs:492). A check-in that happened
# to run before the first update check would therefore panic, so this client
# installs the same ring provider itself, under the same guard.
#
# `ring` rather than aws-lc-rs: the updater already compiles rustls with the
# ring feature into this binary, so this edge adds no package and no second
# provider, where reqwest's `rustls` feature would add aws-lc-sys and a cmake
# C build to a binary we cross-compile to Windows.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

tam-types = { path = "../../../crates/tam-types" }

# The AEAD the Android session store seals the jar with. A workspace crate
# rather than a cipher of our own: it already wraps a per-record data key
# under a caller-supplied 32-byte key-encryption key, with XChaCha20-Poly1305
# and a random nonce at both layers, so no two records share a key and there
# is no nonce-reuse question as marketplaces are added. Adds no package --
# chacha20poly1305 and aead are already in the lock through it.
tam-secrets = { path = "../../../crates/tam-secrets" }

# The data plane. D1 puts every request to a no-API marketplace on this
# machine, so the adapters that compose those requests are compiled into this
# binary rather than into a server one, and the interpreter that decides which
# request to make comes with them.
#
# The adapters are taken with their `live` feature, which is their reqwest
# transport and nothing else. That is a second reqwest major in the bundle
# beside the 0.13 the check-in and the updater share, and it is deliberate:
# the alternative is a third implementation of TPT's measured request shaping
# -- the double-submit CSRF header, the per-hop sec-fetch envelope and the
# browser identity that decide whether Cloudflare answers with the form or an
# interstitial -- written here and kept true by hand. Both resolve to one
# rustls 0.23 over ring, so this adds no second TLS stack and no C toolchain
# to the Windows cross-compile, which is what the reqwest note above is
# protecting.
# The item vocabulary the ledger and the machine share. A direct edge rather
# than a re-export through the driver crate, because this crate names
# `SellerEvent` and `JobItemId` in its own signatures.
tam-domain          = { path = "../../../crates/tam-domain" }
tam-engine-driver   = { path = "../../../crates/tam-engine-driver" }
tam-marketplace     = { path = "../../../crates/tam-marketplace" }
tam-marketplace-tes = { path = "../../../crates/tam-marketplace-tes" }
tam-marketplace-tpt = { path = "../../../crates/tam-marketplace-tpt" }

# The archive probe and reader the bundle unwrap needs. A marketplace hands
# over a bundle and the target's product slot takes one file, so the device has
# to look inside before it uploads. Already proven portable: `just
# check-portable` compiles this crate for every 64-bit client triple.
tam-pipeline        = { path = "../../../crates/tam-pipeline" }

# One keychain backend per platform rather than the crate's umbrella feature,
# so a Windows build never compiles D-Bus and a Linux build never compiles
# Security Framework. `linux-native` is deliberately not used: linux-keyutils
# is the kernel session keyring and does not survive a reboot, which a stored
# marketplace session must.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
ring  = { version = "0.17", features = ["std"] }
# The scripted adapter and the fixtures the interpreter's own conformance suite
# uses, so the end-to-end test drives the real pull, the real interpreter and
# the real settle without a marketplace.
tam-engine-driver = { path = "../../../crates/tam-engine-driver", features = [
  "testing",
] }
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }

[lints]
workspace = true
