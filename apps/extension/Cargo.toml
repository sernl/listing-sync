[package]
name    = "tam-extension"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-channel      = { version = "0.3", default-features = false, features = ["std"] }
js-sys               = "0.3"
serde_json           = "1"
# Pinned exactly for the reason tam-core-wasm pins it: wasm-bindgen refuses a
# CLI whose version differs from the crate's, and the CLI is the one nixpkgs
# carries at the rev flake.lock pins.
wasm-bindgen         = "=0.2.121"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version  = "0.3"
features = ["Headers", "Request", "RequestInit", "Response"]

[lints]
workspace = true
