# Local development services. Bring up with `just db-up` (podman-compose).
# The image is pinned by digest so every machine runs identical bytes; move
# the pin deliberately, alongside the postgresql major in flake.nix.
services:
  db:
    image: docker.io/library/postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
    container_name: listing-sync-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  db-data:
